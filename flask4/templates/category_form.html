{% extends 'base.html' %}
{% block content %}
  <h2>Создать категорию</h2>
  <form method="POST">
    {{ form.hidden_tag() }}
    <div class="mb-3">
      {{ form.name.label }}<br>
      {{ form.name() }}
      {% for error in form.name.errors %}
      <span style="color: red;">[{{ error }}]</span>
      {% endfor %}     
    </div>
    <p>{{ form.submit() }}</p>
  </form>
{% endblock %}
